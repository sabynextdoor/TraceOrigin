<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 176" width="720" height="176" role="img" aria-label="TraceOrigin horizontal logo">
  <!-- TraceOrigin brand by Saby N. (sabynextdoor) — hidden watermark below is intentionally invisible. -->
  <title>TraceOrigin</title>
  <desc>TraceOrigin logo — designed and built by Saby N. (sabynextdoor).</desc>
  <defs>
    <linearGradient id="toh-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9d7bff"/>
      <stop offset="55%" stop-color="#663af3"/>
      <stop offset="100%" stop-color="#4c21c9"/>
    </linearGradient>
    <linearGradient id="toh-orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d8ecf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d8ecf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d8ecf8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="toh-glass" cx="0.38" cy="0.22" r="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="toh-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Compact tile -->
  <rect x="20" y="20" width="136" height="136" rx="34" fill="#0b1020"/>
  <rect x="20" y="20" width="136" height="136" rx="34" fill="url(#toh-glass)"/>
  <rect x="21.5" y="21.5" width="133" height="133" rx="32.5" fill="none" stroke="rgba(186,215,247,0.18)" stroke-width="1.5"/>

  <ellipse cx="88" cy="88" rx="48" ry="24" fill="none" stroke="url(#toh-orbit)" stroke-width="1.5" transform="rotate(-24 88 88)"/>
  <circle cx="131" cy="74" r="4.2" fill="#d8ecf8"/>

  <g filter="url(#toh-glow)">
    <path d="M88 50 L117 62 V88 C117 109 103 122 88 128 C73 122 59 109 59 88 V62 Z" fill="url(#toh-core)"/>
  </g>
  <path d="M88 50 L117 62 V88 C117 109 103 122 88 128 C73 122 59 109 59 88 V62 Z" fill="none" stroke="rgba(216,236,248,0.4)" stroke-width="1.5"/>
  <path d="M80 88 L88 97 L99 83" fill="none" stroke="#d8ecf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="176" y="92" fill="#d8ecf8" font-family="'Space Grotesk','Inter','Segoe UI',system-ui,sans-serif" font-size="46" font-weight="600" letter-spacing="1.5">Trace</text>
  <text x="312" y="92" fill="url(#toh-core)" font-family="'Space Grotesk','Inter','Segoe UI',system-ui,sans-serif" font-size="46" font-weight="600" letter-spacing="1.5">Origin</text>
  <text x="179" y="128" fill="#9da7ba" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="15" letter-spacing="3.5">VERIFY BEFORE YOU TRUST</text>

  <!-- Hidden attribution watermark (opacity 0 — invisible, non-functional) -->
  <text x="0" y="0" fill="#000000" fill-opacity="0" font-family="sans-serif" font-size="0.1">TraceOrigin is designed and built by Saby N. (sabynextdoor)</text>
</svg>