name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Package & publish release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@sabynextdoor"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package npm tarball
        run: |
          mkdir -p "${{ github.workspace }}/dist-artifacts"
          npm pack --pack-destination "${{ github.workspace }}/dist-artifacts"

      - name: Zip production build
        run: |
          tar -czf "${{ github.workspace }}/dist-artifacts/traceorigin-frontend.tar.gz" -C dist .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: traceorigin-v${{ steps.version.outputs.version }}-artifacts
          path: dist-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TraceOrigin v${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist-artifacts/*